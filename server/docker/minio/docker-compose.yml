services:
  minio:
    image: minio/minio
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"  # 控制台地址
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - /home/minio/data:/data
      - /home/minio/config:/root/.minio
    command: server /data --console-address ":9000" --address ":9001"